<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>基本設定</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
    .header { background: #06C755; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-title { font-size: 13px; color: #888; font-weight: bold; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 20px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; font-size: 14px; color: #555; font-weight: 500; margin-bottom: 6px; }
    input[type="time"] {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; font-size: 18px; color: #333;
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.2s;
    }
    input[type="time"]:focus { outline: none; border-color: #06C755; }
    .hint { font-size: 12px; color: #aaa; margin-top: 4px; }
    .btn-primary {
      width: 100%; padding: 15px; background: #06C755; color: white;
      border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 20px; transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { background: #b0b0b0; cursor: not-allowed; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 500;
      white-space: nowrap; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #1b5e20; color: white; }
    .toast.error { background: #b71c1c; color: white; }
    .loading { text-align: center; padding: 40px; color: #aaa; }
  </style>
</head>
<body>
  <div class="header">⚙️ 基本設定</div>
  <div class="container">
    <div id="loading" class="loading">読み込み中...</div>
    <div id="content" style="display:none">
      <div class="card">
        <div class="card-title">デフォルト勤務時間</div>
        <div class="form-group">
          <label for="startTime">開始時間</label>
          <input type="time" id="startTime" value="09:00">
        </div>
        <div class="form-group">
          <label for="endTime">終了時間</label>
          <input type="time" id="endTime" value="18:00">
        </div>
        <div class="form-group">
          <label for="breakTime">休憩時間</label>
          <input type="time" id="breakTime" value="01:00">
          <div class="hint">例: 1時間の休憩は 01:00</div>
        </div>
      </div>
      <button class="btn-primary" id="saveBtn" onclick="save()">登録</button>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const EXEC_URL = '<?!= execUrl ?>';

    function runScript(fn, ...args) {
      return fetch(EXEC_URL + '?api=1', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fn, args }),
      }).then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    function toTimeInput(t) {
      if (!t) return '00:00';
      const p = t.split(':');
      return p[0].padStart(2, '0') + ':' + (p[1] || '00').padStart(2, '0');
    }

    function showToast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
      ]);
    }

    async function init() {
      const loadingEl = document.getElementById('loading');
      let stage = '(1)設定取得';
      try {
        loadingEl.textContent = stage + '中...';
        const config = await withTimeout(runScript('getClientConfig', 'settings'), 6000);

        stage = '(2)LIFF初期化';
        loadingEl.textContent = stage + '中...';
        if (config.liffId) {
          try {
            await withTimeout(liff.init({ liffId: config.liffId }), 4000);
            const profile = await withTimeout(liff.getProfile(), 4000);
            await withTimeout(runScript('saveLineUserId', profile.userId), 4000);
          } catch (e) {
            console.warn('LIFF初期化スキップ:', e.message);
          }
        }

        stage = '(3)基本設定取得';
        loadingEl.textContent = stage + '中...';
        const result = await withTimeout(runScript('getBasicSettingsForClient'), 6000);
        if (result.success && result.data) {
          document.getElementById('startTime').value = toTimeInput(result.data.startTime);
          document.getElementById('endTime').value   = toTimeInput(result.data.endTime);
          document.getElementById('breakTime').value = toTimeInput(result.data.breakTime);
        }
        loadingEl.style.display = 'none';
      } catch (e) {
        loadingEl.style.color = '#c62828';
        loadingEl.textContent = '停止: ' + stage + ' / ' + (e && e.message ? e.message : String(e));
      } finally {
        document.getElementById('content').style.display = 'block';
      }
    }

    async function save() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '保存中...';
      try {
        const settings = {
          startTime: document.getElementById('startTime').value,
          endTime:   document.getElementById('endTime').value,
          breakTime: document.getElementById('breakTime').value,
        };
        const result = await runScript('saveBasicSettingsFromClient', settings);
        if (result.success) {
          showToast('✓ 保存しました', 'success');
        } else {
          showToast('エラー: ' + result.error, 'error');
        }
      } catch (e) {
        showToast('保存に失敗しました', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '登録';
      }
    }

    init();
  </script>
</body>
</html>
