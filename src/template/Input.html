<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勤怠入力</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
    .header { background: #06C755; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px 16px 80px; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-title { font-size: 13px; color: #888; font-weight: bold; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
    .date-row { display: flex; align-items: center; gap: 10px; }
    .date-display { flex: 1; font-size: 18px; font-weight: bold; color: #333; }
    .day-badge { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .day-badge.weekday { background: #e8f5e9; color: #2e7d32; }
    .day-badge.saturday { background: #e3f2fd; color: #1565c0; }
    .day-badge.sunday { background: #ffebee; color: #c62828; }
    .form-group { margin-bottom: 20px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; font-size: 14px; color: #555; font-weight: 500; margin-bottom: 6px; }
    input[type="date"],
    input[type="time"],
    input[type="text"],
    textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; font-size: 16px; color: #333;
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.2s; background: white;
    }
    input:focus, textarea:focus { outline: none; border-color: #06C755; }
    textarea { resize: vertical; min-height: 72px; }
    .working-time-display { font-size: 22px; font-weight: bold; color: #06C755; text-align: center; padding: 12px; }
    .working-label { font-size: 13px; color: #888; text-align: center; }
    .btn-primary {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px; background: #06C755; color: white;
      border: none; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { background: #b0b0b0; }
    .toast {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 500;
      white-space: nowrap; opacity: 0; transition: opacity 0.3s; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #1b5e20; color: white; }
    .toast.error { background: #b71c1c; color: white; }
    .loading { text-align: center; padding: 40px; color: #aaa; }
  </style>
</head>
<body>
  <div class="header">✏️ 勤怠入力</div>
  <div class="container">
    <div id="loading" class="loading">読み込み中...</div>
    <div id="content" style="display:none">
      <!-- 日付選択 -->
      <div class="card">
        <div class="card-title">日付</div>
        <div class="form-group" style="margin-bottom:0">
          <input type="date" id="dateInput" onchange="onDateChange()">
        </div>
      </div>

      <!-- 勤務時間 -->
      <div class="card">
        <div class="card-title">勤務時間</div>
        <div class="form-group">
          <label for="startTime">開始時間</label>
          <input type="time" id="startTime" oninput="updateWorkingTime()">
        </div>
        <div class="form-group">
          <label for="endTime">終了時間</label>
          <input type="time" id="endTime" oninput="updateWorkingTime()">
        </div>
        <div class="form-group">
          <label for="breakTime">休憩時間</label>
          <input type="time" id="breakTime" oninput="updateWorkingTime()">
        </div>
        <div style="background:#f9f9f9; border-radius:8px; padding:12px; margin-top:4px;">
          <div class="working-label">実働時間</div>
          <div class="working-time-display" id="workingTimeDisplay">─</div>
        </div>
      </div>

      <!-- 作業内容 -->
      <div class="card">
        <div class="card-title">作業内容</div>
        <div class="form-group" style="margin-bottom:0">
          <textarea id="workContent" placeholder="本日の作業内容を入力（任意）"></textarea>
        </div>
      </div>
    </div>
  </div>

  <button class="btn-primary" id="saveBtn" onclick="save()" style="display:none">登録</button>
  <div id="toast" class="toast"></div>

  <script>
    const EXEC_URL = '<?!= execUrl ?>';

    function runScript(fn, ...args) {
      return fetch(EXEC_URL + '?api=1', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fn, args }),
      }).then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    function toTimeInput(t) {
      if (!t) return '';
      const p = t.split(':');
      return p[0].padStart(2, '0') + ':' + (p[1] || '00').padStart(2, '0');
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function showToast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    function timeToMin(t) {
      if (!t) return 0;
      const [h, m] = t.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function minToTime(min) {
      if (min <= 0) return '0:00';
      return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');
    }

    function updateWorkingTime() {
      const start = timeToMin(document.getElementById('startTime').value);
      const end   = timeToMin(document.getElementById('endTime').value);
      const brk   = timeToMin(document.getElementById('breakTime').value);
      const work  = end - start - brk;
      document.getElementById('workingTimeDisplay').textContent =
        (start && end) ? minToTime(work) + 'h' : '─';
    }

    async function loadAttendance(dateStr) {
      // dateStr は "YYYY-MM-DD"
      const slashed = dateStr.replace(/-/g, '/');
      const result = await runScript('getAttendanceForClient', slashed);
      if (result.success && result.data) {
        const d = result.data;
        document.getElementById('startTime').value   = toTimeInput(d.startTime);
        document.getElementById('endTime').value     = toTimeInput(d.endTime);
        document.getElementById('breakTime').value   = toTimeInput(d.breakTime);
        document.getElementById('workContent').value = d.workContent || '';
        updateWorkingTime();
      }
    }

    async function onDateChange() {
      const dateStr = document.getElementById('dateInput').value;
      if (!dateStr) return;
      await loadAttendance(dateStr);
    }

    async function save() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = '保存中...';

      const dateStr = document.getElementById('dateInput').value;
      const startTime = document.getElementById('startTime').value;
      const endTime   = document.getElementById('endTime').value;
      const breakTime = document.getElementById('breakTime').value;

      if (!dateStr || !startTime || !endTime) {
        showToast('日付・開始時間・終了時間は必須です', 'error');
        btn.disabled = false;
        btn.textContent = '登録';
        return;
      }

      try {
        const slashed = dateStr.replace(/-/g, '/');
        const date = new Date(dateStr);
        const days = ['日','月','火','水','木','金','土'];
        const record = {
          date:        slashed,
          dayOfWeek:   days[date.getDay()],
          startTime,
          endTime,
          workContent: document.getElementById('workContent').value,
          breakTime:   breakTime || '0:00',
          workingTime: '',
        };
        const result = await runScript('saveAttendanceFromClient', record);
        if (result.success) {
          showToast('✓ 登録しました', 'success');
        } else {
          showToast('エラー: ' + result.error, 'error');
        }
      } catch (e) {
        showToast('保存に失敗しました', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '登録';
      }
    }

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
      ]);
    }

    async function init() {
      const loadingEl = document.getElementById('loading');
      let stage = '(1)設定取得';
      try {
        loadingEl.textContent = stage + '中...';
        const config = await withTimeout(runScript('getClientConfig', 'input'), 6000);

        stage = '(2)LIFF初期化';
        loadingEl.textContent = stage + '中...';
        if (config.liffId) {
          try {
            await withTimeout(liff.init({ liffId: config.liffId }), 4000);
            const profile = await withTimeout(liff.getProfile(), 4000);
            await withTimeout(runScript('saveLineUserId', profile.userId), 4000);
          } catch (e) {
            console.warn('LIFF初期化スキップ:', e.message);
          }
        }

        stage = '(3)勤怠データ取得';
        loadingEl.textContent = stage + '中...';
        document.getElementById('dateInput').value = todayStr();
        await withTimeout(loadAttendance(todayStr()), 6000);
        loadingEl.style.display = 'none';
      } catch (e) {
        loadingEl.style.color = '#c62828';
        loadingEl.textContent = '停止: ' + stage + ' / ' + (e && e.message ? e.message : String(e));
      } finally {
        document.getElementById('content').style.display = 'block';
        document.getElementById('saveBtn').style.display = 'block';
      }
    }

    init();
  </script>
</body>
</html>
