<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>勤怠表の出力</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
    .header { background: #06C755; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-title { font-size: 13px; color: #888; font-weight: bold; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 0; }
    label { display: block; font-size: 14px; color: #555; font-weight: 500; margin-bottom: 6px; }
    input[type="month"] {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0;
      border-radius: 8px; font-size: 18px; color: #333;
      -webkit-appearance: none; appearance: none; background: white;
    }
    input[type="month"]:focus { outline: none; border-color: #06C755; }
    .btn-primary {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px; background: #06C755; color: white;
      border: none; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    .btn-primary:disabled { background: #b0b0b0; }
    .preview-card { background: white; border-radius: 12px; margin-top: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .preview-header { background: #e8f5e9; padding: 12px 16px; font-size: 14px; font-weight: bold; color: #2e7d32; }
    .preview-body { padding: 16px; }
    .preview-entry { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .preview-entry:last-child { border-bottom: none; }
    .preview-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .preview-row .date-col { color: #333; font-weight: 500; min-width: 90px; }
    .preview-row .time-col { color: #555; flex: 1; text-align: center; }
    .preview-row .work-col { color: #06C755; font-weight: bold; min-width: 56px; text-align: right; }
    .preview-row.weekend .date-col { color: #9e9e9e; }
    .preview-row.empty .time-col { color: #ccc; }
    .preview-detail { margin-top: 4px; padding-left: 90px; font-size: 12px; color: #999; overflow-wrap: anywhere; }
    .preview-total { background: #f9f9f9; padding: 14px 16px; font-size: 15px; font-weight: bold; color: #333; text-align: right; border-top: 1.5px solid #e0e0e0; }
    .preview-total span { color: #06C755; font-size: 20px; }
    .toast {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      padding: 12px 24px; border-radius: 24px; font-size: 14px; font-weight: 500;
      white-space: nowrap; opacity: 0; transition: opacity 0.3s; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #1b5e20; color: white; }
    .toast.error { background: #b71c1c; color: white; }
    .loading { text-align: center; padding: 40px; color: #aaa; }
    .sent-badge { display: inline-block; background: #06C755; color: white; border-radius: 12px; padding: 3px 10px; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">📊 勤怠表の出力</div>
  <div class="container">
    <div id="loading" class="loading">読み込み中...</div>
    <div id="content" style="display:none">
      <div class="card">
        <div class="card-title">出力する月を選択</div>
        <div class="form-group">
          <label for="monthInput">年月</label>
          <input type="month" id="monthInput">
        </div>
      </div>
      <div id="preview" style="display:none"></div>
    </div>
  </div>

  <button class="btn-primary" id="outputBtn" onclick="output()" style="display:none">LINEに送信</button>
  <div id="toast" class="toast"></div>

  <script>
    const EXEC_URL = '<?!= execUrl ?>';

    function runScript(fn, ...args) {
      return fetch(EXEC_URL + '?api=1', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fn, args }),
      }).then((res) => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    function showToast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => { el.className = 'toast'; }, 4000);
    }

    function timeToMin(t) {
      if (!t) return 0;
      const [h, m] = t.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }
    function minToTime(min) {
      return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function renderPreview(records) {
      const days = ['日','月','火','水','木','金','土'];
      let totalMin = 0, workDays = 0;
      let rows = '';

      for (const r of records) {
        const d = new Date(r.date.replace(/\//g, '-'));
        const dayIdx = d.getDay();
        const isWe = dayIdx === 0 || dayIdx === 6;
        const dayClass = isWe ? 'weekend' : '';
        const dayLabel = `${String(d.getDate()).padStart(2,' ')}日(${days[dayIdx]})`;

        if (r.isDayOff) {
          const detail = r.workContent ? escapeHtml(r.workContent) : '';
          rows += `<div class="preview-entry">
            <div class="preview-row ${dayClass}">
              <span class="date-col">${dayLabel}</span>
              <span class="time-col">休み</span>
              <span class="work-col"></span>
            </div>
            ${detail ? `<div class="preview-detail">${detail}</div>` : ''}
          </div>`;
        } else if (!r.startTime) {
          rows += `<div class="preview-entry">
            <div class="preview-row ${dayClass} empty">
              <span class="date-col">${dayLabel}</span>
              <span class="time-col">─</span>
              <span class="work-col"></span>
            </div>
          </div>`;
        } else {
          totalMin += timeToMin(r.workingTime);
          workDays++;
          const detail = `休憩 ${escapeHtml(r.breakTime || '─')}`
            + (r.workContent ? `　${escapeHtml(r.workContent)}` : '');
          rows += `<div class="preview-entry">
            <div class="preview-row ${dayClass}">
              <span class="date-col">${dayLabel}</span>
              <span class="time-col">${r.startTime}〜${r.endTime}</span>
              <span class="work-col">${r.workingTime}h</span>
            </div>
            <div class="preview-detail">${detail}</div>
          </div>`;
        }
      }

      const preview = document.getElementById('preview');
      const [year, month] = document.getElementById('monthInput').value.split('-');
      preview.innerHTML = `
        <div class="preview-card">
          <div class="preview-header">${year}年${parseInt(month)}月 勤怠表 — ${workDays}日稼働</div>
          <div class="preview-body">${rows}</div>
          <div class="preview-total">総稼働時間 <span>${minToTime(totalMin)}h</span></div>
        </div>`;
      preview.style.display = 'block';
    }

    async function loadPreview() {
      const val = document.getElementById('monthInput').value;
      if (!val) return;
      const [year, month] = val.split('-').map(Number);
      try {
        const result = await runScript('getMonthlyAttendanceForClient' ,year, month);
        if (result.success && result.data && result.data.length > 0) {
          renderPreview(result.data);
        } else {
          document.getElementById('preview').innerHTML =
            '<div class="card" style="margin-top:16px;color:#aaa;text-align:center;padding:20px;">データがありません</div>';
          document.getElementById('preview').style.display = 'block';
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function output() {
      const val = document.getElementById('monthInput').value;
      if (!val) { showToast('年月を選択してください', 'error'); return; }

      const btn = document.getElementById('outputBtn');
      btn.disabled = true;
      btn.textContent = '送信中...';

      const [year, month] = val.split('-').map(Number);
      try {
        const result = await runScript('outputMonthlyReport', year, month);
        if (result.success) {
          showToast('✓ LINEに送信しました', 'success');
          // プレビューに送信済みバッジ追加
          const header = document.querySelector('.preview-header');
          if (header && !header.querySelector('.sent-badge')) {
            header.innerHTML += ' <span class="sent-badge">送信済み</span>';
          }
        } else {
          showToast('エラー: ' + result.error, 'error');
        }
      } catch (e) {
        showToast('送信に失敗しました', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'LINEに送信';
      }
    }

    function currentMonthStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    // 月変更時にプレビューを再描画
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('monthInput').addEventListener('change', loadPreview);
    });

    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
      ]);
    }

    async function init() {
      const loadingEl = document.getElementById('loading');
      let stage = '(1)設定取得';
      try {
        loadingEl.textContent = stage + '中...';
        const config = await withTimeout(runScript('getClientConfig', 'output'), 6000);

        stage = '(2)LIFF初期化';
        loadingEl.textContent = stage + '中...';
        if (config.liffId) {
          try {
            await withTimeout(liff.init({ liffId: config.liffId }), 4000);
            const profile = await withTimeout(liff.getProfile(), 4000);
            await withTimeout(runScript('saveLineUserId', profile.userId), 4000);
          } catch (e) {
            console.warn('LIFF初期化スキップ:', e.message);
          }
        }

        stage = '(3)月次データ取得';
        loadingEl.textContent = stage + '中...';
        document.getElementById('monthInput').value = currentMonthStr();
        await withTimeout(loadPreview(), 6000);
        loadingEl.style.display = 'none';
      } catch (e) {
        loadingEl.style.color = '#c62828';
        loadingEl.textContent = '停止: ' + stage + ' / ' + (e && e.message ? e.message : String(e));
      } finally {
        document.getElementById('content').style.display = 'block';
        document.getElementById('outputBtn').style.display = 'block';
      }
    }

    init();
  </script>
</body>
</html>
